; Auto-start Unreal Engine 5.8's built-in MCP server (Experimental "Unreal MCP" plugin)
; so AI agents (Claude Code etc.) can drive the editor at http://127.0.0.1:8000/mcp
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000

; Keep PIE running at full speed while an MCP client drives the editor from another window
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
